name: Package Elements Shell

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-shell:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build ElementsShell.exe
        shell: pwsh
        run: |
          ./tools/Build-ElementsShellExe.ps1

      - name: Signing placeholder
        if: ${{ false }}
        shell: pwsh
        run: |
          Write-Host "Placeholder for future Authenticode signing."

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ElementsShell
          path: |
            dist/ElementsShell.exe
            dist/ElementsShell-win-x64-*.zip
            dist/ElementsShell-*-sha256.txt
            dist/ElementsShell-quickstart-*.txt

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = @(
            'dist/ElementsShell.exe'
            'dist/ElementsShell-win-x64-*.zip'
            'dist/ElementsShell-*-sha256.txt'
            'dist/ElementsShell-quickstart-*.txt'
          )

          $existing = gh release view $tag --json tagName --jq .tagName 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $existing) {
            gh release create $tag $files --title $tag --generate-notes
          }
          else {
            gh release upload $tag $files --clobber
          }
