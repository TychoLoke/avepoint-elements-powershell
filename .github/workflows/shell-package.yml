name: Package Elements Shell

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-shell:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PowerShell
        uses: PowerShell/PowerShell-For-GitHub-Actions@v2

      - name: Build ElementsShell.exe
        shell: pwsh
        run: |
          ./tools/Build-ElementsShellExe.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElementsShell
          path: dist/ElementsShell.exe

      - name: Attach ElementsShell.exe to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ElementsShell.exe
