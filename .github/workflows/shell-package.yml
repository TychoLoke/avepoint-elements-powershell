name: Package Elements Shell

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-shell:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build ElementsShell.exe
        shell: pwsh
        run: |
          ./tools/Build-ElementsShellExe.ps1

      - name: Signing placeholder
        if: ${{ false }}
        shell: pwsh
        run: |
          Write-Host "Placeholder for future Authenticode signing."

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ElementsShell
          path: |
            dist/ElementsShell.exe
            dist/ElementsShell-win-x64-*.zip
            dist/ElementsShell-*-sha256.txt

      - name: Attach ElementsShell.exe to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ElementsShell.exe
            dist/ElementsShell-win-x64-*.zip
            dist/ElementsShell-*-sha256.txt
