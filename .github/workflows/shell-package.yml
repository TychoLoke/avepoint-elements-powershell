name: Package Elements Shell

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-shell:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build ElementsShell.exe
        shell: pwsh
        run: |
          ./tools/Build-ElementsShellExe.ps1

      - name: Build Elements Shell Desktop package
        shell: pwsh
        run: |
          ./tools/Build-ElementsShellDesktop.ps1

      - name: Build Elements Shell Desktop MSI
        shell: pwsh
        run: |
          ./tools/Build-ElementsShellDesktopMsi.ps1

      - name: Signing placeholder
        if: ${{ false }}
        shell: pwsh
        run: |
          Write-Host "Placeholder for future Authenticode signing."

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ElementsShell
          path: |
            dist/ElementsShell.exe
            dist/ElementsShell-win-x64-*.zip
            dist/ElementsShell-*-sha256.txt
            dist/ElementsShell-quickstart-*.txt
            dist/desktop/ElementsShell.Desktop-win-x64-*.zip
            dist/desktop/ElementsShell.Desktop-*-sha256.txt
            dist/desktop/*/ElementsShell.Desktop-quickstart-*.txt
            dist/desktop/*/ElementsShell.exe
            dist/installer/*.msi
            dist/installer/*-msi-sha256.txt

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $patterns = @(
            'dist/ElementsShell.exe'
            'dist/ElementsShell-win-x64-*.zip'
            'dist/ElementsShell-*-sha256.txt'
            'dist/ElementsShell-quickstart-*.txt'
            'dist/desktop/ElementsShell.Desktop-win-x64-*.zip'
            'dist/desktop/ElementsShell.Desktop-*-sha256.txt'
            'dist/desktop/*/ElementsShell.Desktop-quickstart-*.txt'
            'dist/desktop/*/ElementsShell.exe'
            'dist/installer/*.msi'
            'dist/installer/*-msi-sha256.txt'
          )

          $files = foreach ($pattern in $patterns) {
            Get-ChildItem -Path $pattern -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          }

          if (-not $files) {
            throw 'No release assets were found to publish.'
          }

          $existing = gh release view $tag --json tagName --jq .tagName 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $existing) {
            gh release create $tag --title $tag --generate-notes
          }

          foreach ($file in $files) {
            $name = Split-Path $file -Leaf
            gh release delete-asset $tag $name --yes 2>$null | Out-Null
            gh release upload $tag $file
          }
